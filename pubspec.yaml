name: tanbih
description: "Tanbih — pengingat shalat & adzan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state & architecture
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^9.2.0
  injectable: ^2.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  auto_route: ^11.1.0

  # prayer domain
  adhan: ^2.0.0+1
  hijri: ^3.0.1

  # location
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1

  # notifications & time
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

  # audio
  just_audio: ^0.10.6

  # network — enhancement only, never required by core features
  dio: ^5.7.0
  connectivity_plus: ^7.0.0
  talker_dio_logger: ^5.0.0

  # ui
  flutter_svg: ^2.0.0
  flutter_screenutil: ^5.9.3

  # storage & utils
  shared_preferences: ^2.3.2
  path_provider: ^2.1.1
  crypto: ^3.0.3
  intl: ^0.20.2
  talker_flutter: ^5.0.0
  talker_bloc_logger: ^5.0.0
  bloc_concurrency: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  auto_route_generator: ^10.5.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/audio/
    - assets/data/

  fonts:
    # Body text — matches the app screens in Figma.
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    # Wordmark & headings — brand typography. Variable font: select weight
    # with FontVariation('wght', ...) in AppTextStyle, not fontWeight alone.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
