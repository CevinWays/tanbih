# Cold-start splash.
#
# Follows the system theme so there is no colour jump into the app: the light
# background is the exact ground Home uses, the dark one is the brand navy.
# A single fixed colour meant a phone in light mode saw a dark splash and then
# a pale app, which read as a flash of the wrong screen.
#
# The Figma splash frame (node 1:44) is deliberately not used. It carries
# another app's name and tagline, its magenta and orange are nowhere in the
# Tanbih palette, and since Android 12 the system draws the splash itself —
# it allows a background colour, one icon, and a small branding image, not
# arbitrary artwork. Showing that illustration would mean a second splash
# after the system one, with a colour jump between them.
flutter_native_splash:
  color: "#E2F4F7"
  color_dark: "#131C2E"

  image: assets/images/splash_mark.png
  image_dark: assets/images/splash_mark.png

  # The wordmark sits in the branding slot the system provides. Two files
  # because the letters have to invert: navy on the light ground, white on
  # the dark one. Pre-Android-12 draws it at its natural proportions.
  branding: assets/images/wordmark_on_light.png
  branding_dark: assets/images/wordmark_on_dark.png
  branding_mode: bottom

  android_12:
    color: "#E2F4F7"
    color_dark: "#131C2E"
    # Android 12+ masks this to a circle over roughly two thirds of the
    # frame, so the asset is padded rather than filling its canvas.
    image: assets/images/splash_mark.png
    image_dark: assets/images/splash_mark.png
    icon_background_color: "#E2F4F7"
    icon_background_color_dark: "#131C2E"
    # Android 12+ fits the branding image into a fixed 200x80dp box. The
    # wordmark is 4.2:1, so filling that 2.5:1 box stretched the letters
    # vertically. These variants are the same wordmark centred on a 2.5:1
    # canvas, so its aspect already matches the slot and nothing is
    # distorted.
    branding: assets/images/wordmark_boxed_light.png
    branding_dark: assets/images/wordmark_boxed_dark.png

  android: true
  ios: false
  web: false
