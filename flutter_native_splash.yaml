#
# The Figma splash frame (node 1:44) carries another app's copy — "Prayer
# Reminder / Bringing you closer to Allah" — which is deliberately not used.
flutter_native_splash:
  color: "#131C2E"
  image: assets/images/logo_mark_foreground.png

  android_12:
    color: "#131C2E"
    image: assets/images/logo_mark_foreground.png
    icon_background_color: "#131C2E"

  android: true
  ios: false
  web: false
